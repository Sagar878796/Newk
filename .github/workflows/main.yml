name: IPTV Auto Update

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install requests
        run: pip install requests

      - name: Run script
        run: python convert.py

      - name: Commit & Push
        run: |
          git config --global user.name "iptv-bot"
          git config --global user.email "bot@iptv.com"
          git add playlist.m3u
          git commit -m "Auto update playlist" || echo "No changes"
          git push
